<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="عبود">
  <title>عبود - Gemini Voice</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --bg-color: #0f172a;
      --chat-user: #6d28d9;
      --chat-bot: rgba(30, 41, 59, 0.75);
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* النقطة التفاعلية في منتصف الشاشة */
    .orb-stage {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .voice-orb {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f472b6, #8b5cf6 60%, #3b82f6);
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.45);
      pointer-events: auto;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    /* هالات التفاعل المحيطة بالنقطة */
    .orb-glow {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.4), transparent 70%);
      opacity: 0.4;
      pointer-events: none;
      animation: orb-idle 4s infinite ease-in-out;
    }

    /* حالات النقطة التفاعلية */
    .voice-orb.idle {
      animation: orb-idle 3.5s infinite ease-in-out;
    }

    .voice-orb.listening {
      transform: scale(1.15);
      box-shadow: 0 0 60px rgba(244, 114, 182, 0.75), 0 0 100px rgba(139, 92, 246, 0.4);
      animation: orb-listen 1.4s infinite alternate ease-in-out;
    }

    .voice-orb.thinking {
      animation: orb-spin 1.8s infinite linear;
      box-shadow: 0 0 45px rgba(59, 130, 246, 0.8);
    }

    .voice-orb.speaking {
      animation: orb-speak 0.75s infinite alternate ease-in-out;
      box-shadow: 0 0 70px rgba(168, 85, 247, 0.9), 0 0 120px rgba(236, 72, 153, 0.5);
    }

    @keyframes orb-idle {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes orb-listen {
      0% { transform: scale(1.1); filter: hue-rotate(0deg); }
      100% { transform: scale(1.28); filter: hue-rotate(45deg); }
    }

    @keyframes orb-spin {
      0% { transform: scale(1.05) rotate(0deg); filter: hue-rotate(0deg); }
      100% { transform: scale(1.05) rotate(360deg); filter: hue-rotate(180deg); }
    }

    @keyframes orb-speak {
      0% { transform: scale(1.1); filter: brightness(1); }
      100% { transform: scale(1.35); filter: brightness(1.25); }
    }

    .orb-label {
      margin-top: 18px;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      transition: opacity 0.3s ease;
    }

    /* رأس الصفحة */
    header {
      position: relative;
      z-index: 20;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: calc(env(safe-area-inset-top) + 10px) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-info h1 { font-size: 17px; font-weight: 700; color: #f1f5f9; }
    .header-info p { font-size: 11px; color: #94a3b8; }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .btn-toggle-voice {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-toggle-voice.muted {
      color: #64748b;
      opacity: 0.6;
    }

    .btn-icon {
      background: none;
      border: none;
      font-size: 19px;
      cursor: pointer;
      color: #e2e8f0;
      padding: 6px;
    }

    /* صندوق الرسائل */
    #chat-box {
      position: relative;
      z-index: 5;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 8px;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.5;
      word-wrap: break-word;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--chat-bot);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-right-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--chat-user);
      color: #ffffff;
      border-bottom-left-radius: 4px;
    }

    .bubble .time {
      font-size: 9.5px;
      opacity: 0.55;
      display: block;
      margin-top: 4px;
      text-align: left;
    }

    .notice-tag {
      font-size: 11px;
      color: #fbbf24;
      display: block;
      margin-top: 5px;
    }

    /* شريط الكتابة */
    footer {
      position: relative;
      z-index: 20;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #user-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 15px;
      outline: none;
      direction: rtl;
    }

    #user-input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.1);
    }

    .action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: white;
      background: var(--primary);
    }

    .btn-mic {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }

    /* نافذة المفتاح */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      max-width: 380px;
      width: 100%;
      padding: 20px;
      color: #fff;
    }

    .modal-content h2 { font-size: 18px; margin-bottom: 8px; }
    .modal-content p { font-size: 13px; color: #94a3b8; margin-bottom: 14px; line-height: 1.4; }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      direction: ltr;
      margin-bottom: 15px;
    }

    .modal-btns { display: flex; gap: 8px; }
    .btn-primary {
      flex: 1;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- النقطة التفاعلية الملونة في منتصف الشاشة -->
  <div class="orb-stage">
    <div class="voice-orb idle" id="center-orb" title="اضغط للتحدث الحي">
      <div class="orb-glow"></div>
    </div>
    <div class="orb-label" id="orb-label">اضغط النقطة للحكي</div>
  </div>

  <header>
    <div class="header-info">
      <h1>عبود</h1>
      <p>صوت Gemini الأنثوي الرقيق</p>
    </div>
    <div class="header-actions">
      <button class="btn-toggle-voice" id="voice-toggle">🔊 الصوت</button>
      <button class="btn-icon" id="settings-btn" title="المفتاح">⚙️</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <footer>
    <button class="action-btn btn-mic" id="mic-btn" title="المايك">🎙️</button>
    <input type="text" id="user-input" placeholder="اكتب أو اضغط النقطة للمحادثة..." autocomplete="off">
    <button class="action-btn" id="send-btn">➤</button>
  </footer>

  <!-- عنصر تشغيل الصوت -->
  <audio id="audio-player" playsinline preload="auto"></audio>

  <div class="modal" id="api-modal">
    <div class="modal-content">
      <h2>مفتاح Gemini 🔑</h2>
      <p>أدخل مفتاحك المجاني من Google AI Studio (يبدأ بـ AIzaSy..).</p>
      <div class="input-group">
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
      </div>
      <div class="modal-btns">
        <button class="btn-primary" id="save-key-btn">حفظ</button>
        <button class="btn-secondary" id="cancel-key-btn" style="display:none;">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    // ---------- الإعدادات والنماذج ----------
    const TEXT_MODEL_PRIMARY = "gemini-2.5-flash-lite";
    const TEXT_MODEL_FALLBACK = "gemini-2.5-flash";
    const TTS_MODEL = "gemini-2.5-flash-preview-tts"; // أحدث نموذج TTS من جوجل
    const VOICE_NAME = "Aoede"; // نبرة صوت أنثوية ناعمة ورقيقة وتفاعلية

    const API_STORAGE_KEY = "abboud_gemini_api_key";
    const CHAT_HISTORY_KEY = "abboud_gemini_history";
    const VOICE_PREF_KEY = "abboud_voice_enabled";

    let apiKey = localStorage.getItem(API_STORAGE_KEY) || "";
    let conversation = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY)) || [];
    let voiceEnabled = localStorage.getItem(VOICE_PREF_KEY) !== "false";

    let currentAudioSeq = 0; // لمنع تكرار الصوت
    const audioPlayer = document.getElementById("audio-player");

    // شخصية شامية عفوية ومحترمة وبدون أي إطالة
    const SYSTEM_PROMPT = `أنت "عبود"، مساعد شخصي ودود ولطيف جداً.
تتحدث بنبرة صوت أنثوية رقيقة ومهذبة، وبالعامية الشامية البسيطة المحترمة (مثل: تكرم عينك، من عيوني، أهلاً وسهلاً، ولا يهمك).
قواعد أساسية:
1. ردودك قصيرة جداً ومباشرة (جملة أو جملتين فقط).
2. ممنوع استخدام النجوم (**) أو الرموز أو الإيموجي أو التشكيل المعقد ليكون النطق الصوتي ناعماً ونقياً.
3. لا تستخدم ألقاباً مبالغاً فيها.`;

    function saveHistory() {
      localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(conversation));
    }

    // ---------- حالة النقطة التفاعلية (Center Orb) ----------
    const centerOrb = document.getElementById("center-orb");
    const orbLabel = document.getElementById("orb-label");

    function setOrbState(state, customLabel = "") {
      centerOrb.className = `voice-orb ${state}`;
      if (customLabel) {
        orbLabel.textContent = customLabel;
      } else {
        switch (state) {
          case 'idle':
            orbLabel.textContent = liveVoiceMode ? "عم اسمعك..." : "اضغط النقطة للحكي";
            break;
          case 'listening':
            orbLabel.textContent = "عم اسمعك...";
            break;
          case 'thinking':
            orbLabel.textContent = "عم فكر...";
            break;
          case 'speaking':
            orbLabel.textContent = "عم احكي (اضغط للمقاطعة)";
            break;
        }
      }
    }

    // ---------- نظام الصوت: إيقاف، تحضير، وتنظيف ----------
    function stopAudioPlayback() {
      currentAudioSeq++; // إبطال أي طلب صوت سابق في الخلفية
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      audioPlayer.removeAttribute('src');
      audioPlayer.load();
      if (centerOrb.classList.contains("speaking")) {
        setOrbState(liveVoiceMode ? "listening" : "idle");
      }
    }

    // فك حظر الصوت في متصفح Safari على الآيفون عند أول تفاعل
    function unlockAudioForSafari() {
      audioPlayer.play().catch(() => {});
    }

    // تنظيف النص قبل إرساله للـ TTS (حذف النجوم، الرموز، وعلامات الترقيم)
    function sanitizeForTTS(text) {
      return text
        .replace(/[*#_~`>\[\]\(\)\\]/g, '') // إزالة الماركداون
        .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '') // إزالة الإيموجي
        .replace(/[،,؛;:.؟!؟"\-\/]/g, ' ') // إزالة علامات الترقيم لعدم نطقها واستبدالها بمسافة
        .replace(/\s+/g, ' ')
        .trim();
    }

    // تحويل الـ PCM/WAV القادم من Gemini وتشغيله
    function base64ToWavBlob(base64Data, sampleRate = 24000) {
      const binaryString = window.atob(base64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // إذا كان الملف يحتوي على ترويسة RIFF مسبقاً نستخدمه مباشرة
      if (bytes.length >= 12 && String.fromCharCode(...bytes.slice(0, 4)) === 'RIFF') {
        return new Blob([bytes], { type: 'audio/wav' });
      }

      // وإلا نقوم بتركيب ترويسة WAV 44-byte لـ PCM 24000Hz 16-bit Mono
      const wavBuffer = new ArrayBuffer(44 + bytes.byteLength);
      const view = new DataView(wavBuffer);
      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + bytes.byteLength, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, bytes.byteLength, true);
      new Uint8Array(wavBuffer, 44).set(bytes);

      return new Blob([wavBuffer], { type: 'audio/wav' });
    }

    // طلب وتشغيل Gemini TTS
    async function playGeminiTTS(textToSpeak) {
      if (!voiceEnabled || !apiKey) return;

      const seq = ++currentAudioSeq;
      const cleanText = sanitizeForTTS(textToSpeak);
      if (!cleanText) return;

      setOrbState("thinking", "جاري تجهيز الصوت...");

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: cleanText }] }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            voiceConfig: {
              prebuiltVoiceConfig: { voiceName: VOICE_NAME }
            }
          }
        }
      };

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // إذا أوقف المستخدم الصوت أثناء انتظار الرد نلغي التشغيل
        if (seq !== currentAudioSeq) return;

        const data = await res.json();
        const base64Audio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;

        if (res.ok && base64Audio) {
          const blob = base64ToWavBlob(base64Audio);
          const audioUrl = URL.createObjectURL(blob);

          audioPlayer.src = audioUrl;
          setOrbState("speaking");

          audioPlayer.onended = () => {
            URL.revokeObjectURL(audioUrl);
            setOrbState(liveVoiceMode ? "listening" : "idle");
          };

          audioPlayer.onerror = () => {
            setOrbState(liveVoiceMode ? "listening" : "idle");
          };

          audioPlayer.play().catch(() => {
            setOrbState(liveVoiceMode ? "listening" : "idle");
          });

        } else {
          // في حال انتهاء الحصة أو خطأ بـ TTS
          showVoiceNotice();
          setOrbState(liveVoiceMode ? "listening" : "idle");
        }
      } catch (err) {
        showVoiceNotice();
        setOrbState(liveVoiceMode ? "listening" : "idle");
      }
    }

    function showVoiceNotice() {
      const notice = document.createElement("div");
      notice.className = "notice-tag";
      notice.textContent = "تعذر تشغيل الصوت من السيرفر حالياً، تم عرض الرد كتابياً.";
      chatBox.appendChild(notice);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // زر تشغيل/إيقاف الصوت
    const voiceToggleBtn = document.getElementById("voice-toggle");
    voiceToggleBtn.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      localStorage.setItem(VOICE_PREF_KEY, voiceEnabled);
      voiceToggleBtn.classList.toggle("muted", !voiceEnabled);
      voiceToggleBtn.textContent = voiceEnabled ? "🔊 الصوت" : "🔇 صامت";
      if (!voiceEnabled) stopAudioPlayback();
    });

    if (!voiceEnabled) {
      voiceToggleBtn.classList.add("muted");
      voiceToggleBtn.textContent = "🔇 صامت";
    }

    // ---------- المحادثة الحية التفاعلية (Microphone / Barge-in) ----------
    let liveVoiceMode = false;
    let recognition = null;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ar-SY';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        setOrbState(audioPlayer.paused ? "listening" : "speaking");
      };

      recognition.onresult = (event) => {
        // ميزة المقاطعة الفورية (Barge-in): عند بدء كلامك يتوقف الصوت فوراً
        if (!audioPlayer.paused) {
          stopAudioPlayback();
        }

        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          }
        }

        if (finalTranscript.trim()) {
          userInput.value = finalTranscript.trim();
          handleSendMessage();
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed') {
          stopLiveMode();
          alert("يرجى إعطاء صلاحية المايك في سفاري.");
        }
      };

      recognition.onend = () => {
        if (liveVoiceMode) {
          setTimeout(() => {
            try { recognition.start(); } catch (err) {}
          }, 200);
        } else {
          setOrbState("idle");
        }
      };
    }

    function toggleLiveMode() {
      unlockAudioForSafari();
      if (!recognition) {
        alert("التعرف على الصوت غير مدعوم على متصفحك.");
        return;
      }
      liveVoiceMode = !liveVoiceMode;
      if (liveVoiceMode) {
        stopAudioPlayback();
        try { recognition.start(); } catch (e) {}
        setOrbState("listening");
      } else {
        stopLiveMode();
      }
    }

    function stopLiveMode() {
      liveVoiceMode = false;
      try { recognition.stop(); } catch (e) {}
      setOrbState("idle");
    }

    // الضغط على النقطة الملونة في المنتصف يبدأ أو يوقف المحادثة الحية
    centerOrb.addEventListener("click", () => {
      // إذا كان عبود يتكلم، الضغط يقاطع الصوت مباشرة
      if (!audioPlayer.paused) {
        stopAudioPlayback();
      } else {
        toggleLiveMode();
      }
    });

    document.getElementById("mic-btn").addEventListener("click", toggleLiveMode);

    // ---------- إرسال وتول
