<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="عبود">
  <title>عبود</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* شريط علوي */
    header {
      z-index: 30;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: calc(env(safe-area-inset-top) + 8px) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .title-area h1 { font-size: 17px; font-weight: 700; color: #fff; }
    .title-area p { font-size: 11px; color: #94a3b8; }

    .header-btns { display: flex; gap: 8px; align-items: center; }

    .voice-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .voice-btn.muted { opacity: 0.5; color: #94a3b8; }

    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 19px;
      cursor: pointer;
      padding: 4px;
    }

    /* النقطة التفاعلية بنصف الشاشة */
    .orb-wrapper {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .orb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f472b6, #8b5cf6 65%, #3b82f6);
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.5);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: orb-breathe 3s infinite ease-in-out;
    }

    .orb.listening {
      transform: scale(1.2);
      box-shadow: 0 0 60px rgba(244, 114, 182, 0.85);
      animation: orb-pulse 1.2s infinite alternate ease-in-out;
    }

    .orb.speaking {
      transform: scale(1.25);
      box-shadow: 0 0 70px rgba(168, 85, 247, 0.95);
      animation: orb-speak 0.7s infinite alternate ease-in-out;
    }

    .orb.thinking {
      animation: orb-spin 1.4s infinite linear;
      box-shadow: 0 0 45px rgba(59, 130, 246, 0.8);
    }

    @keyframes orb-breathe {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes orb-pulse {
      0% { transform: scale(1.1); filter: hue-rotate(0deg); }
      100% { transform: scale(1.28); filter: hue-rotate(40deg); }
    }
    @keyframes orb-speak {
      0% { transform: scale(1.1); }
      100% { transform: scale(1.35); }
    }
    @keyframes orb-spin {
      0% { transform: scale(1.05) rotate(0deg); }
      100% { transform: scale(1.05) rotate(360deg); }
    }

    .orb-text {
      margin-top: 14px;
      font-size: 13px;
      color: #cbd5e1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    /* مساحة المحادثة */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
      -webkit-overflow-scrolling: touch;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .bubble.bot {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom-right-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: #7c3aed;
      border-bottom-left-radius: 4px;
    }

    .bubble .time {
      font-size: 10px;
      opacity: 0.6;
      display: block;
      margin-top: 4px;
      text-align: left;
    }

    /* الشريط السفلي */
    footer {
      z-index: 30;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #user-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 15px;
      outline: none;
      direction: rtl;
    }
    #user-input:focus { border-color: var(--primary); }

    .btn-action {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-send { background: var(--primary); }
    .btn-mic { background: rgba(255, 255, 255, 0.12); }
    .btn-mic.active { background: #ec4899; box-shadow: 0 0 14px rgba(236, 72, 153, 0.6); }

    /* نافذة المفتاح */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
    }

    .modal-box h2 { font-size: 17px; margin-bottom: 8px; }
    .modal-box p { font-size: 13px; color: #94a3b8; margin-bottom: 14px; }
    .modal-box input {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      direction: ltr;
      margin-bottom: 14px;
    }

    .modal-actions { display: flex; gap: 8px; }
    .btn-save { flex: 1; padding: 10px; border-radius: 8px; border: none; background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; }
    .btn-close { padding: 10px 14px; border-radius: 8px; border: none; background: #334155; color: #cbd5e1; cursor: pointer; }
  </style>
</head>
<body>

  <!-- النقطة التفاعلية -->
  <div class="orb-wrapper">
    <div class="orb" id="orb-elem" title="اضغط للتحدث"></div>
    <div class="orb-text" id="orb-text">اضغط النقطة للحكي</div>
  </div>

  <header>
    <div class="title-area">
      <h1>عبود</h1>
      <p>مساعدك الصوتي الذكي</p>
    </div>
    <div class="header-btns">
      <button class="voice-btn" id="voice-toggle">🔊 الصوت</button>
      <button class="icon-btn" id="settings-btn" title="المفتاح">⚙️</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <footer>
    <button class="btn-action btn-mic" id="mic-btn" title="المايك">🎙️</button>
    <input type="text" id="user-input" placeholder="اكتب أو اضغط النقطة للحكي..." autocomplete="off">
    <button class="btn-action btn-send" id="send-btn">➤</button>
  </footer>

  <div class="modal" id="modal-elem">
    <div class="modal-box">
      <h2>مفتاح Gemini 🔑</h2>
      <p>حط مفتاحك من Google AI Studio (يبدأ بـ AIzaSy..). رح ينحفظ بجهازك فقط.</p>
      <input type="password" id="key-input" placeholder="AIzaSy...">
      <div class="modal-actions">
        <button class="btn-save" id="save-btn">حفظ</button>
        <button class="btn-close" id="close-modal-btn">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    // ---------- الإعدادات والذاكرة ----------
    const API_KEY_NAME = "abboud_api_key_v2";
    let apiKey = localStorage.getItem(API_KEY_NAME) || "";
    let voiceEnabled = true;
    let liveMode = false;
    let isSpeaking = false;
    let currentAudio = null;

    const SYSTEM_PROMPT = `أنت "عبود"، مساعد شخصي ودود ولطيف جداً.
تتحدث بنبرة أنثوية رقيقة ومحترمة، وبالعامية الشامية البسيطة المهذبة (مثل: تكرم عينك، من عيوني، أهلاً وسهلاً، ولا يهمك).
القواعد:
1. ردودك قصيرة جداً ومباشرة (جملة أو جملتين فقط).
2. لا تستخدم علامات النجوم ** أو الرموز أو الإيموجي نهائياً لضمان سلامة الصوت.
3. لا تستخدم ألقاباً مبالغاً فيها.`;

    let history = [
      { role: "user", parts: [{ text: "مرحبا" }] },
      { role: "model", parts: [{ text: "أهلاً وسهلاً فيك، كيف فيني ساعدك اليوم؟" }] }
    ];

    // عناصر الواجهة
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");
    const orbElem = document.getElementById("orb-elem");
    const orbText = document.getElementById("orb-text");
    const voiceToggle = document.getElementById("voice-toggle");
    const settingsBtn = document.getElementById("settings-btn");
    const modalElem = document.getElementById("modal-elem");
    const keyInput = document.getElementById("key-input");
    const saveBtn = document.getElementById("save-btn");
    const closeModalBtn = document.getElementById("close-modal-btn");

    function updateOrb(state, msg) {
      orbElem.className = `orb ${state}`;
      orbText.textContent = msg;
    }

    function addMessage(sender, text) {
      const b = document.createElement("div");
      b.className = `bubble ${sender}`;
      const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      b.innerHTML = `${text} <span class="time">${time}</span>`;
      chatBox.appendChild(b);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ---------- نظام الصوت والنطق الأنثوي السلس ----------
    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.removeAttribute('src');
        currentAudio = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      if (liveMode) updateOrb("listening", "عم اسمعك...");
      else updateOrb("idle", "اضغط النقطة للحكي");
    }

    function cleanTextForSpeech(text) {
      return text
        .replace(/[*#_~`>\[\]\(\)\\]/g, '')
        .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
        .replace(/[،,؛;:.؟!؟"'\-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function playVoice(text) {
      if (!voiceEnabled) return;
      stopAudio();

      const cleaned = cleanTextForSpeech(text);
      if (!cleaned) return;

      isSpeaking = true;
      updateOrb("speaking", "عم احكي (اضغط للمقاطعة)");

      // صوت عربي نقي وسريع
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=${encodeURIComponent(cleaned)}`;
      currentAudio = new Audio(url);

      currentAudio.onended = () => {
        isSpeaking = false;
        if (liveMode) updateOrb("listening", "عم اسمعك...");
        else updateOrb("idle", "اضغط النقطة للحكي");
      };

      currentAudio.onerror = () => {
        // بديل محلي في حال حجب سفاري للصوت الشبكي
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(cleaned);
          u.lang = 'ar-SA';
          u.rate = 1.05;
          u.onend = () => {
            isSpeaking = false;
            if (liveMode) updateOrb("listening", "عم اسمعك...");
            else updateOrb("idle", "اضغط النقطة للحكي");
          };
          window.speechSynthesis.speak(u);
        } else {
          isSpeaking = false;
          updateOrb("idle", "اضغط النقطة للحكي");
        }
      };

      currentAudio.play().catch(() => {
        isSpeaking = false;
        updateOrb("idle", "اضغط النقطة للحكي");
      });
    }

    // ---------- إرسال الرسالة إلى Gemini ----------
    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      if (!apiKey) {
        modalElem.style.display = "flex";
        keyInput.focus();
        return;
      }

      stopAudio();
      addMessage("user", text);
      userInput.value = "";

      history.push({ role: "user", parts: [{ text }] });
      updateOrb("thinking", "عم فكر...");

      const payload = {
        contents: history.slice(-8),
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        generationConfig: {
          thinkingConfig: { thinkingBudget: 0 },
          maxOutputTokens: 200,
          temperature: 0.6
        }
      };

      // تجربة gemini-2.5-flash-lite ثم gemini-2.5-flash
      const models = ["gemini-2.5-flash-lite", "gemini-2.5-flash"];
      let reply = null;

      for (let m of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
            reply = data.candidates[0].content.parts[0].text;
            break;
          }
        } catch (e) {}
      }

      if (reply) {
        history.push({ role: "model", parts: [{ text: reply }] });
        addMessage("bot", reply);
        playVoice(reply);
      } else {
        updateOrb(liveMode ? "listening" : "idle", liveMode ? "عم اسمعك..." : "اضغط النقطة للحكي");
        addMessage("bot", "بعتذر منك، في ضغط لحظي عالسيرفر. جرب تسألني كمان شوي.");
      }
    }

    // ---------- التعرف الصوتي (المايك) وميزة المقاطعة ----------
    let recognition = null;
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRec) {
      try {
        recognition = new SpeechRec();
        recognition.lang = 'ar-SY';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
          micBtn.classList.add("active");
          updateOrb("listening", "عم اسمعك...");
        };

        recognition.onresult = (e) => {
          // مقاطعة الصوت إذا كان عبود يتكلم
          if (isSpeaking) stopAudio();

          let finalTranscript = '';
          for (let i = e.resultIndex; i < e.results.length; ++i) {
            if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
          }

          if (finalTranscript.trim()) {
            userInput.value = finalTranscript.trim();
            handleSend();
          }
        };

        recognition.onend = () => {
          if (liveMode) {
            setTimeout(() => { try { recognition.start(); } catch(err){} }, 200);
          } else {
            micBtn.classList.remove("active");
            updateOrb("idle", "اضغط النقطة للحكي");
          }
        };

        recognition.onerror = () => {
          if (!liveMode) {
            micBtn.classList.remove("active");
            updateOrb("idle", "اضغط النقطة للحكي");
          }
        };
      } catch (err) {}
    }

    function toggleLive() {
      if (isSpeaking) {
        stopAudio();
        return;
      }

      if (!recognition) {
        alert("المايك غير مدعوم على متصفحك أو يحتاج لإذن.");
        return;
      }

      liveMode = !liveMode;

      if (liveMode) {
        stopAudio();
        try { recognition.start(); } catch (e) {}
      } else {
        try { recognition.stop(); } catch (e) {}
        micBtn.classList.remove("active");
        updateOrb("idle", "اضغط النقطة للحكي");
      }
    }

    // ---------- ربط جميع الأحداث بالأزرار فوراً ----------
    sendBtn.addEventListener("click", handleSend);

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleSend();
      }
    });

    micBtn.addEventListener("click", toggleLive);
    orbElem.addEventListener("click", toggleLive);

    voiceToggle.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      voiceToggle.classList.toggle("muted", !voiceEnabled);
      voiceToggle.textContent = voiceEnabled ? "🔊 الصوت" : "🔇 صامت";
      if (!voiceEnabled) stopAudio();
    });

    settingsBtn.addEventListener("click", () => {
      keyInput.value = apiKey;
      modalElem.style.display = "flex";
      keyInput.focus();
    });

    closeModalBtn.addEventListener("click", () => {
      modalElem.style.display = "none";
    });

    saveBtn.addEventListener("click", () => {
      const val = keyInput.value.trim();
      if (val) {
        apiKey = val;
        localStorage.setItem(API_KEY_NAME, apiKey);
        modalElem.style.display = "none";
        addMessage("bot", "تم حفظ المفتاح بنجاح! تفضل شو بتحب نسولف؟");
      }
    });

    // رسالة الترحيب الأولى
    window.addEventListener("DOMContentLoaded", () => {
      addMessage("bot", "أهلاً وسهلاً فيك! أنا عبود، كيف فيني ساعدك اليوم؟");
      if (!apiKey) {
        setTimeout(() => { modalElem.style.display = "flex"; }, 500);
      }
    });
  </script>
</body>
</html>
