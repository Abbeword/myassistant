<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="عبود">
  <title>عبود - المساعد الذكي</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --bg-color: #0f172a;
      --chat-user: #6d28d9;
      --chat-bot: rgba(30, 41, 59, 0.85);
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* رأس الصفحة */
    header {
      position: relative;
      z-index: 50;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: calc(env(safe-area-inset-top) + 10px) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-info h1 { font-size: 17px; font-weight: 700; color: #f1f5f9; }
    .header-info p { font-size: 11px; color: #94a3b8; }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .btn-toggle-voice {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-toggle-voice.muted {
      color: #64748b;
      opacity: 0.6;
    }

    .btn-icon {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #e2e8f0;
      padding: 6px;
    }

    /* النقطة التفاعلية في منتصف الشاشة */
    .orb-stage {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none; /* حتى لا تمنع لمس الشاشة */
    }

    .voice-orb {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f472b6, #8b5cf6 60%, #3b82f6);
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.45);
      pointer-events: auto; /* فقط النقطة نفسها تستقبل الضغط */
      cursor: pointer;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .voice-orb.idle {
      animation: orb-idle 3.5s infinite ease-in-out;
    }

    .voice-orb.listening {
      transform: scale(1.18);
      box-shadow: 0 0 55px rgba(244, 114, 182, 0.8), 0 0 90px rgba(139, 92, 246, 0.5);
      animation: orb-listen 1.3s infinite alternate ease-in-out;
    }

    .voice-orb.thinking {
      animation: orb-spin 1.5s infinite linear;
      box-shadow: 0 0 45px rgba(59, 130, 246, 0.8);
    }

    .voice-orb.speaking {
      animation: orb-speak 0.75s infinite alternate ease-in-out;
      box-shadow: 0 0 65px rgba(168, 85, 247, 0.9), 0 0 100px rgba(236, 72, 153, 0.6);
    }

    @keyframes orb-idle {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes orb-listen {
      0% { transform: scale(1.12); filter: hue-rotate(0deg); }
      100% { transform: scale(1.26); filter: hue-rotate(40deg); }
    }

    @keyframes orb-spin {
      0% { transform: scale(1.05) rotate(0deg); }
      100% { transform: scale(1.05) rotate(360deg); }
    }

    @keyframes orb-speak {
      0% { transform: scale(1.1); }
      100% { transform: scale(1.32); }
    }

    .orb-label {
      margin-top: 15px;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    /* صندوق الرسائل */
    #chat-box {
      position: relative;
      z-index: 5;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--chat-bot);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-right-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--chat-user);
      color: #ffffff;
      border-bottom-left-radius: 4px;
    }

    .bubble .time {
      font-size: 9.5px;
      opacity: 0.55;
      display: block;
      margin-top: 4px;
      text-align: left;
    }

    /* شريط الإدخال */
    footer {
      position: relative;
      z-index: 50;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #user-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 15px;
      outline: none;
      direction: rtl;
      -webkit-user-select: text;
      user-select: text;
    }

    #user-input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.12);
    }

    .action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: white;
      background: var(--primary);
      flex-shrink: 0;
    }

    .btn-mic {
      background: rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
    }

    .btn-mic.active {
      background: #ec4899;
      color: white;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
    }

    /* نافذة المفتاح */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      max-width: 380px;
      width: 100%;
      padding: 20px;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .modal-content h2 { font-size: 18px; }
    .modal-content p { font-size: 13px; color: #94a3b8; margin-bottom: 14px; line-height: 1.4; }

    .input-group input {
      width: 100%;
      padding: 11px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      direction: ltr;
      margin-bottom: 15px;
    }

    .modal-btns { display: flex; gap: 8px; }
    .btn-primary {
      flex: 1;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- النقطة التفاعلية في المنتصف -->
  <div class="orb-stage">

  <script>

    function setOrbState(state, text = "") {

        else if (state === 'speaking') orbLabel.textContent = "عم احكي (اضغط للمقاطعة)";
      }
    }

    function addMessageToUI(sender, text) {

      timeSpan.textContent = timeStr;
      bubble.appendChild(timeSpan);

      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function stopAudioPlayback() {
      currentAudioSeq++;
      try {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.removeAttribute('src');
      } catch (e) {}
      if (centerOrb.classList.contains("speaking")) {
        setOrbState(liveVoiceMode ? "listening" : "idle");
      }
    }

    function unlockAudioForSafari() {
      try { audioPlayer.play().catch(() => {}); } catch (e) {}
    }

    // تنظيف النص قبل إرساله للصوت
    function sanitizeForTTS(text) {
      return text
        .replace(/[*#_~`>\[\]\(\)\\]/g, '')
        .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
        .replace(/[،,؛;:.؟!؟"\-\/]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function base64ToWavBlob(base64Data, sampleRate = 24000) {
      const binaryString = window.atob(base64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

      if (bytes.length >= 12 && String.fromCharCode(...bytes.slice(0, 4)) === 'RIFF') {
        return new Blob([bytes], { type: 'audio/wav' });
      }

      const wavBuffer = new ArrayBuffer(44 + bytes.byteLength);
      const view = new DataView(wavBuffer);
      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + bytes.byteLength, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, bytes.byteLength, true);
      new Uint8Array(wavBuffer, 44).set(bytes);

      return new Blob([wavBuffer], { type: 'audio/wav' });
    }
